name: Dependency Review

on:
  pull_request:
    branches: ["main"]

# Default minimal permissions — each job overrides only what it needs.
permissions: read-all

# ----------------------------------------------------------
# DEPENDENCY REVIEW
# Blocks merging if HIGH or CRITICAL vulnerabilities are
# introduced by a dependency change in a pull request.
# ----------------------------------------------------------

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
