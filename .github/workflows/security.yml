name: Security scanning

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Default minimal permissions — each job overrides only what it actually needs.
permissions: read-all

# Cancel in-progress runs for the same branch/PR when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# Overview of checks:
#
#  powershell-lint  → PSScriptAnalyzer (all .ps1 scripts)
#  trivy-scan       → Trivy (filesystem vulnerability scan)
#  devskim          → DevSkim (insecure code patterns in PowerShell)
#  semgrep          → Semgrep (OWASP Top 10, secrets detection)
#  actionlint       → actionlint (validates GitHub Actions workflow YAML)
# ============================================================

jobs:

  # ----------------------------------------------------------
  # POWERSHELL LINT
  # Runs PSScriptAnalyzer on all PowerShell scripts.
  # Settings: .github/PSScriptAnalyzerSettings.psd1
  # ----------------------------------------------------------
  powershell-lint:
    name: PowerShell lint (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run PSScriptAnalyzer (SARIF output)
        uses: microsoft/psscriptanalyzer-action@6b2948b1944407914a58661c49941824d149734f # v1.1
        with:
          path: ./
          recurse: true
          settings: .github/PSScriptAnalyzerSettings.psd1
          output: psscriptanalyzer-results.sarif

      - name: Upload PSScriptAnalyzer results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          sarif_file: psscriptanalyzer-results.sarif
          category: psscriptanalyzer

  # ----------------------------------------------------------
  # TRIVY SECURITY SCAN
  # Scans the repository for HIGH/CRITICAL vulnerabilities.
  # ----------------------------------------------------------
  trivy-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  # ----------------------------------------------------------
  # DEVSKIM SECURITY LINT
  # Catches insecure patterns in PowerShell: deprecated crypto,
  # injection risks, unsafe APIs.
  # ----------------------------------------------------------
  devskim:
    name: Security lint (DevSkim)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run DevSkim
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6 # v1.0.16

      - name: Upload DevSkim results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        if: always()
        with:
          sarif_file: devskim-results.sarif
          category: devskim

  # ----------------------------------------------------------
  # SEMGREP
  # Detects hardcoded secrets and OWASP Top 10 patterns.
  # Never blocks CI — findings go to Security tab only.
  # ----------------------------------------------------------
  semgrep:
    name: Semgrep (OWASP / secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep \
            --config auto \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif \
            Scripts/ || true

      - name: Upload Semgrep results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ----------------------------------------------------------
  # ACTIONLINT
  # Validates all GitHub Actions workflow YAML files.
  # Fails CI so broken workflows are caught before merge.
  # ----------------------------------------------------------
  actionlint:
    name: GitHub Actions lint (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
