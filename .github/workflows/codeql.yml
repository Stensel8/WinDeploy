name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 04:00 UTC

# Default minimal permissions — each job overrides only what it needs.
permissions: read-all

# ============================================================
# Overview of checks:
#
#  analyze-actions  → CodeQL static analysis on GitHub Actions workflows
# ============================================================

jobs:

  # ----------------------------------------------------------
  # GITHUB ACTIONS ANALYSIS
  # Scans workflow YAML files for logic errors and misconfigurations.
  # ----------------------------------------------------------
  analyze-actions:
    name: Analyze GitHub Actions (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:actions"
