name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 04:00 UTC

# Default minimal permissions — each job overrides only what it needs.
permissions: read-all

# ============================================================
# Overview of checks:
#
#  analyze-actions  → CodeQL static analysis on GitHub Actions workflows
# ============================================================

jobs:

  # ----------------------------------------------------------
  # GITHUB ACTIONS ANALYSIS
  # Scans workflow YAML files for logic errors and misconfigurations.
  # ----------------------------------------------------------
  analyze-actions:
    name: Analyze GitHub Actions (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          category: "/language:actions"
