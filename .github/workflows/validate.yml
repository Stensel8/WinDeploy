name: Validate scripts

# A full deployment cannot run on GitHub-hosted runners (it needs Windows 11
# 25H2 and real hardware for drivers/BitLocker), but syntax errors, missing
# functions and broken helper logic are caught here before they reach a
# production machine. Windows-latest, not ubuntu: the syntax check wants
# Windows PowerShell/PS7 parsing semantics, and the hostname/architecture
# checks read real Win32_BIOS/PROCESSOR_ARCHITECTURE values.
#
# One job rather than two: GitHub bills per job, rounded up to a whole minute,
# and both halves need the same windows-latest checkout.

on:
  push:
    branches: [main]
    paths:
      - 'Scripts/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Scripts/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Syntax and helper function checks
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check PowerShell version
        shell: pwsh
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion)" -ForegroundColor Cyan
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)" -ForegroundColor Cyan

      - name: Syntax-check all .ps1 files
        shell: pwsh
        run: |
          $errors = @()
          $files = Get-ChildItem -Path . -Filter '*.ps1' -Recurse

          foreach ($file in $files) {
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$null, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              foreach ($err in $parseErrors) {
                $errors += "$($file.FullName):$($err.Extent.StartLineNumber) — $($err.Message)"
              }
            }
          }

          Write-Host "Checked $($files.Count) script(s)."

          if ($errors.Count -gt 0) {
            Write-Host "`nSyntax errors found:" -ForegroundColor Red
            $errors | ForEach-Object { Write-Host "  $_" -ForegroundColor Red }
            exit 1
          }

          Write-Host "All scripts passed syntax check." -ForegroundColor Green

      - name: Test Deploy.ps1 helper functions
        shell: pwsh
        run: |
          # Validate that Get-LatestRelease function definition is loadable
          $content = Get-Content Scripts/Deploy.ps1 -Raw
          $sb = [ScriptBlock]::Create($content.Replace('$releaseTag = Get-LatestRelease', '$releaseTag = "v0.0.0-test"').Replace('Read-Host', '#Read-Host'))
          Write-Host "Deploy.ps1 script block created successfully." -ForegroundColor Green

      - name: Test Start.ps1 helper functions
        shell: pwsh
        run: |
          # Check that key functions exist and are syntactically valid
          $content = Get-Content Scripts/Start.ps1 -Raw
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($content, [ref]$null, [ref]$parseErrors)

          $functions = $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)
          $functionNames = $functions.Name

          $required = @('Get-LatestRelease', 'Get-Pwsh7Path', 'Install-Pwsh7', 'Test-Pwsh7', 'Install-WinGet', 'Update-EnvironmentPath')
          $missing = $required | Where-Object { $_ -notin $functionNames }

          if ($missing.Count -gt 0) {
            Write-Host "Missing required functions: $($missing -join ', ')" -ForegroundColor Red
            exit 1
          }

          Write-Host "All required functions present: $($required -join ', ')" -ForegroundColor Green

      - name: Test Set-HostName logic (non-destructive)
        shell: pwsh
        run: |
          # Test that the hostname generation logic works
          $serial = (Get-CimInstance -ClassName Win32_BIOS).SerialNumber
          if ($serial -and $serial.Length -ge 5) {
            $last5 = $serial.Substring($serial.Length - 5).ToUpper() -replace '[^A-Z0-9]', 'X'
            $hostname = "PC-$last5"
            Write-Host "Hostname would be: $hostname" -ForegroundColor Green
          } else {
            Write-Host "No valid serial — hostname would be set to default" -ForegroundColor Yellow
          }

      - name: Test architecture detection
        shell: pwsh
        run: |
          $arch = $env:PROCESSOR_ARCHITECTURE
          Write-Host "Architecture: $arch" -ForegroundColor Cyan
          $supported = @('AMD64', 'x64', 'ARM64')
          if ($arch -in $supported -or $arch -eq 'AMD64') {
            Write-Host "Architecture is supported by driver detection." -ForegroundColor Green
          } else {
            Write-Host "Unknown architecture: $arch" -ForegroundColor Yellow
          }
